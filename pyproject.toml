[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmltopdf"
version = "0.1.0"
description = "Aplicație web locală pentru consultarea facturilor UBL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1,<4.0",
    "lxml>=5.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10,<7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xmltopdf = ["templates/*.html", "static/css/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

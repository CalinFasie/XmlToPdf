<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>XmlToPdf</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="brand" href="/" aria-label="XmlToPdf — pagina principală">XmlToPdf</a>
        <span>Vizualizator local de facturi UBL</span>
        {% if shutdown_enabled %}
          <div class="header-actions">
            <button class="shutdown-button" id="shutdown-button" type="button" data-action="shutdown">
              Închide aplicația
            </button>
          </div>
        {% endif %}
      </div>
    </header>
    <main class="app-main">
      <section class="upload-panel" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">Procesare locală</p>
          <h1 id="page-title">Vizualizează o factură</h1>
          <p class="intro">Alege un XML UBL de cel mult 10 MiB. Documentul este procesat în memoria aplicației și nu este salvat de aceasta.</p>
        </div>
        <form id="upload-form" data-csrf-token="{{ csrf_token }}">
          <label for="xml-file">Fișier XML</label>
          <div class="upload-controls">
            <input id="xml-file" name="xml-file" type="file" accept=".xml,application/xml,text/xml" required>
            <button type="submit">Afișează factura</button>
          </div>
        </form>
        <p id="upload-status" class="status" role="status" aria-live="polite"></p>
      </section>
      <section id="invoice-container" aria-live="polite" aria-label="Factura încărcată"></section>
    </main>
    <script>
      const form = document.getElementById("upload-form");
      const fileInput = document.getElementById("xml-file");
      const submitButton = form.querySelector("button[type='submit']");
      const shutdownButton = document.getElementById("shutdown-button");
      const status = document.getElementById("upload-status");
      const invoiceContainer = document.getElementById("invoice-container");

      invoiceContainer.addEventListener("click", (event) => {
        if (!(event.target instanceof Element)) {
          return;
        }
        const printButton = event.target.closest('[data-action="print"]');
        if (printButton) {
          window.print();
        }
      });

      if (shutdownButton) {
        shutdownButton.addEventListener("click", async () => {
          if (!window.confirm("Închizi XmlToPdf și serverul local?")) {
            return;
          }

          shutdownButton.disabled = true;
          status.textContent = "Se trimite comanda de oprire…";
          try {
            const response = await fetch("/shutdown", {
              method: "POST",
              headers: { "X-CSRF-Token": form.dataset.csrfToken }
            });
            const result = await response.json();
            if (!response.ok || !result.ok) {
              status.textContent = result.message || "Oprirea XmlToPdf nu a putut fi pornită.";
              shutdownButton.disabled = false;
              return;
            }
            status.textContent = result.message;
          } catch (_error) {
            status.textContent = "Oprirea nu a putut fi confirmată. Poți închide aplicația din system tray.";
            shutdownButton.disabled = false;
          }
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        invoiceContainer.replaceChildren();
        status.textContent = "";

        const file = fileInput.files[0];
        if (!file) {
          status.textContent = "Selectează un fișier XML.";
          return;
        }
        if (file.size > 10 * 1024 * 1024) {
          status.textContent = "XML-ul depășește limita de 10 MiB.";
          return;
        }

        submitButton.disabled = true;
        status.textContent = "Factura se procesează local…";
        try {
          const response = await fetch("/upload", {
            method: "POST",
            headers: {
              "Content-Type": "application/xml",
              "X-CSRF-Token": form.dataset.csrfToken
            },
            body: file
          });
          const result = await response.json();
          if (!response.ok) {
            status.textContent = result.message || "Cererea nu a putut fi procesată.";
            return;
          }
          invoiceContainer.innerHTML = result.invoice_html;
          status.textContent = result.message || "Factura a fost încărcată.";
          fileInput.value = "";
        } catch (_error) {
          status.textContent = "Nu s-a putut comunica cu aplicația locală.";
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
